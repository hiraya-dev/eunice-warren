name: CI

# Checks chosen from the diff (scripts/ci/classify-paths.mjs) and a test tier,
# adapted from adc-website (docs/decisions/0001-workflow-from-adc-website.md).
#
# runtime   build: type-check, unit tests and the production build.
#           e2e: Playwright on the fake-store build, in the Playwright image
#           that matches the lockfile, two workers:
#             smoke  (a draft PR): the tests tagged @smoke.
#             full   (a ready PR, a PR labelled ci:full, a push to main that was
#                    not already tested, a manual run): every test not tagged
#                    @sweep, plus the sweeps job.
#           sweeps: the load-sensitive motion and geometry tests (@sweep),
#           sharded two ways with one worker each; full tier only.
# workflow  checks: Markdown lint, routing, CI-script, hook and lessons tests,
#           the spec map, the lessons ledger, and actionlint.
# docs      checks: Markdown lint only.
#
# main deploys production directly, so the full tier must pass before a merge:
# marking a runtime PR ready ("ship it") starts the full run, and merging needs a
# green gate from it on the head (review-pr **Merging**). A push to main whose
# tree a full-tier PR run already passed skips every check
# (scripts/ci/already-tested.mjs; fails closed). A superseded push's run is
# cancelled. CI never deploys: Cloudflare Workers Builds deploys main to
# production.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
      route: ${{ steps.paths.outputs.route }}
      runtime: ${{ steps.paths.outputs.runtime }}
      workflow: ${{ steps.paths.outputs.workflow }}
      docs: ${{ steps.paths.outputs.docs }}
      full: ${{ steps.tier.outputs.full }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA...${{ github.sha }}" > changed-files.txt
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Run by hand: test everything on this ref.
            git ls-tree -r --name-only "${{ github.sha }}" > changed-files.txt
          elif [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" > changed-files.txt
          elif git rev-parse --verify --quiet "${{ github.sha }}~1" > /dev/null; then
            # New branch, or a force-push left the old tip unreachable.
            git diff --name-only "${{ github.sha }}~1" "${{ github.sha }}" > changed-files.txt
          else
            # Root commit: everything in the tree is new.
            git ls-tree -r --name-only "${{ github.sha }}" > changed-files.txt
          fi
          echo "Changed files:"
          cat changed-files.txt
          node scripts/ci/classify-paths.mjs < changed-files.txt
          echo "Route: $(sed -n 's/^route=//p' "$GITHUB_OUTPUT" | tail -1)"

      # A draft runs the smoke tier; everything else that is runtime runs the
      # full tier. Labels are read from the API, not the event payload, so
      # adding ci:full and rerunning the workflow picks the label up.
      - name: Decide the test tier
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUNTIME: ${{ steps.paths.outputs.runtime }}
        run: |
          full=false
          if [[ "$RUNTIME" == "true" ]]; then
            if [[ "$EVENT" != "pull_request" ]]; then
              full=true; echo "Not a pull request: full tier."
            elif [[ "$DRAFT" != "true" ]]; then
              full=true; echo "Ready pull request: full tier."
            else
              # Read the labels on their own line so an API error fails this
              # step instead of reading as "no ci:full label".
              labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')"
              if grep -qx 'ci:full' <<< "$labels"; then
                full=true; echo "Draft labelled ci:full: full tier."
              else
                echo "Draft pull request: smoke tier."
              fi
            fi
          fi
          echo "Full tier: $full"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      # Fails closed: any doubt or error leaves tested=false and runs the checks.
      - name: Check whether a full-tier PR run already tested this tree
        id: tested
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ci.yml
        run: node scripts/ci/already-tested.mjs

      # The e2e container tag. Read from the lockfile, which npm ci installs, so
      # the image's browsers always match @playwright/test.
      - name: Read the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test']?.version ?? ''")"
          echo "Playwright: ${version:-not in the lockfile}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The production build (top-level wrangler vars, no fake store), which the
  # e2e job's fake-store build does not cover, plus the checks that need
  # node_modules but no browser.
  build:
    name: build
    needs: classify
    if: needs.classify.outputs.tested != 'true' && needs.classify.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Run the unit tests
        run: npm run test:unit
      # A runtime-only PR can add a spec, so the map is checked here as well as
      # in checks.
      - name: Check the Playwright spec map
        run: node scripts/ci/select-specs.mjs --check
      - name: Build the site
        run: npm run build

  # The smoke or full tier, in the Playwright image matching the lockfile's
  # @playwright/test, which ships the browsers and their system packages.
  # playwright.config.ts builds the fake-store site and serves it with astro
  # preview inside the container. Two workers on the runner's four vCPUs; the
  # sweeps stay at the config's one (below). The job name carries the tier, so
  # the merge rule and already-tested.mjs can tell a full run from a smoke run.
  e2e:
    name: e2e (${{ needs.classify.outputs.full == 'true' && 'full' || 'smoke' }})
    needs: classify
    if: needs.classify.outputs.tested != 'true' && needs.classify.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.classify.outputs.playwright }}-noble
      # Chromium runs out of shared memory in Docker's default 64 MB /dev/shm.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The container's default shell is sh, which has no [[ ]].
      - name: Check the image matches @playwright/test
        shell: bash
        env:
          IMAGE_VERSION: ${{ needs.classify.outputs.playwright }}
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [[ "$installed" != "$IMAGE_VERSION" ]]; then
            echo "Installed @playwright/test $installed, image v$IMAGE_VERSION."
            exit 1
          fi
      - name: Check the @sweep tags match SWEEP_SPECS
        run: npm run check:sweep-tags
      - name: Run the end-to-end tier
        shell: bash
        env:
          FULL: ${{ needs.classify.outputs.full }}
        run: |
          if [[ "$FULL" == "true" ]]; then
            npm run test:e2e -- --grep-invert @sweep --workers=2
          else
            npm run test:e2e -- --grep @smoke --workers=2
          fi
      # Retries are 1 in CI, so a test that passes only on its retry is flaky.
      # List each one in the job summary and as a warning, so flakes are counted
      # instead of absorbed by a green run (L-009, L-010).
      - name: Report flaky tests
        if: always()
        run: node scripts/ci/flaky-summary.mjs test-results/results.json
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The motion and geometry tests (@sweep), sharded two ways with one worker
  # each: they are load-sensitive, so shards add machines rather than workers.
  sweeps:
    name: sweeps (${{ matrix.shard }}/2)
    needs: classify
    if: needs.classify.outputs.tested != 'true' && needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.classify.outputs.playwright }}-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the sweeps
        run: npm run test:e2e -- --grep @sweep --shard=${{ matrix.shard }}/2
      - name: Report flaky tests
        if: always()
        run: node scripts/ci/flaky-summary.mjs test-results/results.json
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-sweeps-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # One short job for every docs or workflow change: Markdown lint always, and
  # the workflow checks when a workflow path changed. These npm scripts run plain
  # Node, so the job needs no npm ci.
  checks:
    name: checks
    needs: classify
    if: >-
      needs.classify.outputs.tested != 'true' &&
      (needs.classify.outputs.docs == 'true' || needs.classify.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKFLOW: ${{ needs.classify.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check:lessons compares the ledger with origin/main and its merge-base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Lint markdown
        run: npm run lint:md
      - name: Test path routing and CI scripts
        if: env.WORKFLOW == 'true'
        run: npm run test:ci-scripts
      - name: Check the Playwright spec map
        if: env.WORKFLOW == 'true'
        run: node scripts/ci/select-specs.mjs --check
      - name: Test the hooks and the lessons tooling
        if: env.WORKFLOW == 'true'
        run: npm run test:hooks
      - name: Validate the lessons ledger
        if: env.WORKFLOW == 'true'
        run: npm run check:lessons
      - name: Validate workflow YAML
        if: env.WORKFLOW == 'true'
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v"${ACTIONLINT_VERSION}"/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          ./actionlint -color

  # Fails closed: a selected job that was skipped, failed or cancelled fails it.
  # already-tested.mjs counts only a passed gate on a full-tier run, since a run
  # whose jobs all skip still concludes success.
  gate:
    name: gate
    needs: [classify, build, e2e, sweeps, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the selected route and tier
        env:
          TESTED: ${{ needs.classify.outputs.tested }}
          ROUTE: ${{ needs.classify.outputs.route }}
          RUNTIME: ${{ needs.classify.outputs.runtime }}
          WORKFLOW: ${{ needs.classify.outputs.workflow }}
          DOCS: ${{ needs.classify.outputs.docs }}
          FULL: ${{ needs.classify.outputs.full }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SWEEPS_RESULT: ${{ needs.sweeps.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          failed=0
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Path classification did not complete successfully."
            exit 1
          fi
          if [[ "$TESTED" == "true" ]]; then
            echo "A full-tier PR run already passed this tree; nothing to rerun."
            exit 0
          fi
          if [[ "$RUNTIME" != "true" && "$WORKFLOW" != "true" && "$DOCS" != "true" ]]; then
            echo "Path classification selected no route."
            failed=1
          fi
          for result in "$BUILD_RESULT" "$E2E_RESULT" "$SWEEPS_RESULT" "$CHECKS_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              failed=1
            fi
          done

          if [[ "$RUNTIME" == "true" && \
            ( "$BUILD_RESULT" != "success" || "$E2E_RESULT" != "success" ) ]]; then
            echo "Runtime validation did not complete successfully."
            failed=1
          fi
          if [[ "$RUNTIME" == "true" && "$FULL" == "true" && "$SWEEPS_RESULT" != "success" ]]; then
            echo "The full tier was selected but the sweeps did not pass."
            failed=1
          fi
          if [[ ( "$WORKFLOW" == "true" || "$DOCS" == "true" ) && "$CHECKS_RESULT" != "success" ]]; then
            echo "The checks job did not complete successfully."
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          tier=smoke
          [[ "$FULL" == "true" ]] && tier=full
          if [[ "$RUNTIME" == "true" ]]; then
            echo "Route $ROUTE passed ($tier tier)."
          else
            echo "Route $ROUTE passed."
          fi
