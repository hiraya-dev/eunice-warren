name: Flake check

on:
  workflow_dispatch:
    inputs:
      grep:
        description: Playwright --grep pattern, a test title or spec file name such as footer.spec.ts (no tests/ prefix)
        required: true
        type: string
      repeat:
        description: Times to repeat each matching test (--repeat-each)
        required: false
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test']?.version ?? ''")"
          if [[ -z "$version" ]]; then
            echo "@playwright/test is not in the lockfile."
            exit 1
          fi
          echo "Playwright: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  repeat:
    name: repeat
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repeat the matching tests under load
        shell: bash
        env:
          GREP: ${{ inputs.grep }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          if [[ ! "$REPEAT" =~ ^[1-9][0-9]*$ ]]; then
            echo "repeat must be a positive integer, got: $REPEAT"
            exit 1
          fi
          npx playwright test --grep "$GREP" --repeat-each "$REPEAT" --workers 4 --retries 0
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-flake-check
          path: |
            playwright-report/
            test-results/
          retention-days: 7
